name: Parabank Tests

"on":
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      BASE_URL: http://localhost:8080/parabank/
      BASE_URL_API: http://localhost:8080/parabank/services/bank/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Parabank
        run: docker compose up -d

      - name: Wait for Parabank
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8080/parabank/index.htm > /dev/null; then
              echo "Parabank is ready"
              exit 0
            fi
            echo "Waiting for Parabank..."
            sleep 3
          done

          echo "Parabank did not start"
          docker compose logs
          exit 1

      - name: Debug john login
        run: |
          curl -i http://localhost:8080/parabank/services/bank/login/john/demo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install browsers
        run: playwright install --with-deps chromium

      - name: Run tests
        run: pytest --alluredir=allure-results

      - name: Stop Parabank
        if: always()
        run: docker compose down