name: Parabank Tests

"on":
  push:
    branches: [ main ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      BASE_URL: http://localhost:8080/parabank/
      BASE_URL_API: http://localhost:8080/parabank/services/bank/

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Parabank fresh
        run: |
          docker compose down -v || true
          docker compose pull
          docker compose up -d --force-recreate

      #- name: Start Parabank
      #  run: docker compose up -d

      - name: Wait for ParaBank to be ready
        run: |
          echo "Waiting for ParaBank DB initialization..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/parabank/index.htm)
            if [ "$STATUS" = "200" ]; then
              echo "ParaBank is ready (attempt $i)"
              exit 0
            fi
            echo "Attempt $i: got $STATUS, retrying in 3s..."
            sleep 3
          done
          echo "ParaBank never became ready!"
          exit 1

      - name: Initialize Parabank database
        run: |
          curl -s "http://localhost:8080/parabank/admin.htm?action=INIT" > /dev/null
          sleep 5

      - name: Debug john login
        run: |
          curl -i http://localhost:8080/parabank/services/bank/login/john/demo

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install browsers
        run: playwright install --with-deps chromium

      - name: Check register page
        run: |
          curl -i http://localhost:8080/parabank/register.htm

      - name: Run tests
        #run: pytest --alluredir=allure-results
        run: pytest tests/api/test_get_accTransactions.py || (docker compose logs parabank && exit 1)

      - name: Stop Parabank
        if: always()
        run: docker compose down